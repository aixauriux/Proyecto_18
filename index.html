
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de repositorios GitHub</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <main>
        <h1>Buscador de GitHub</h1>
        <p>Encuentra repositorios de tus lenguajes favoritos.</p>

        <label for="lenguaje">Selecciona un lenguaje:</label>

        <select id="lenguaje">
            <option value="">Selecciona un lenguaje</option>
            <option value="JavaScript">JavaScript</option>
            <option value="Python">Python</option>
            <option value="Java">Java</option>
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="TypeScript">TypeScript</option>
            <option value="PHP">PHP</option>
            <option value="C++">C++</option>
            <option value="Ruby">Ruby</option>
        </select>

        <section id="resultado" aria-live="polite">
            <p>Selecciona un lenguaje para comenzar.</p>
        </section>

        <button id="refrescar" hidden>Buscar otro repositorio</button>

        <button id="reintentar" hidden>Volver a intentar</button>
    </main>

    <script src="js/script.js"></script>

</body>
</html>
